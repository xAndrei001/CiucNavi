name: Build and deploy site

# Stats are fetched fresh on every run and published straight to GitHub Pages.
# Nothing is committed back to the repo, so main/dev never clash with the bot.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://xandrei001.github.io/CiucNavi

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Start from the stats that are live right now, so the trend arrows compare against them.
      # If the live site can't be reached, the copy in the repo is used instead.
      - name: Load current live stats
        run: |
          curl -fsSL "$SITE_URL/data/stats.json" -o /tmp/live-stats.json \
            && python -c "import json;json.load(open('/tmp/live-stats.json'))" \
            && cp /tmp/live-stats.json data/stats.json \
            || echo "Live stats not available, using the repo copy."

      - name: Fetch stats from Leetify
        continue-on-error: true
        env:
          LEETIFY_API_KEY: ${{ secrets.LEETIFY_API_KEY }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: python scripts/update_stats.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
