name: Build and deploy site

# Stats are fetched fresh on every run and published straight to GitHub Pages.
# Nothing is committed back to the repo, so main/dev never clash with the bot.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://xandrei001.github.io/CiucNavi

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # The growing stats history lives on its own branch, which only this bot commits to.
      - uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: stats-history
          path: _history

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Start from the stats that are live right now, so the trend arrows compare against them.
      # If the live site can't be reached, the copy in the repo is used instead.
      - name: Load current live stats
        run: |
          curl -fsSL "$SITE_URL/data/stats.json" -o /tmp/live-stats.json \
            && python -c "import json;json.load(open('/tmp/live-stats.json'))" \
            && cp /tmp/live-stats.json data/stats.json \
            || echo "Live stats not available, using the repo copy."
          if [ -f _history/history.json ]; then cp _history/history.json data/history.json; fi

      - name: Fetch stats from Leetify
        continue-on-error: true
        env:
          LEETIFY_API_KEY: ${{ secrets.LEETIFY_API_KEY }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: python scripts/update_stats.py

      - name: Save stats history
        continue-on-error: true
        run: |
          if [ -d _history/.git ]; then
            cp data/history.json _history/
            cd _history
            git config user.name "ciucnavi-bot"
            git config user.email "actions@users.noreply.github.com"
            git add history.json
            git diff --cached --quiet || { git commit -m "chore: stats history" && git push origin HEAD:stats-history; }
          fi

      - uses: actions/configure-pages@v6

      - run: rm -rf _history

      # Cache-busting: the ?v=... on css/js links in the repo is a placeholder (e.g. ?v=20261128).
      # Every deploy replaces it with this commit + run number, so it never needs bumping by hand.
      - name: Stamp asset versions
        run: |
          sed -i -E "s/\?v=[A-Za-z0-9._-]+/?v=${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}/g" *.html
          grep -q "?v=${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}" *.html \
            || echo "::warning::No ?v= asset links found to stamp"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v5
