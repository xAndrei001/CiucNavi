<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Ciuc Navi | CS2 Team from Miercurea Ciuc</title>
<meta name='description' content='Ciuc Navi - a CS2 Premier team from Miercurea Ciuc.'>
<link rel='preconnect' href='https://fonts.googleapis.com'>
<link rel='preconnect' href='https://fonts.gstatic.com' crossorigin>
<link href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rajdhani:wght@600;700&display=swap' rel='stylesheet'>
<link rel='stylesheet' href='css/style.css'>
</head>
<body data-title='title'>
<canvas id='snow'></canvas>
<div id='progress'></div>

<header class='nav'>
  <a href='#home' class='brand'><span class='brand-mark'>CN</span><span class='brand-text'>CIUC <b>NAVI</b></span></a>
  <nav class='nav-links'>
    <a href='#about' data-i18n='nav.about'>About</a>
    <a href='#roster' data-i18n='nav.roster'>Roster</a>
    <a href='#bench' data-i18n='nav.bench'>Bench</a>
    <a href='#merch' data-i18n='nav.merch'>Merch</a>
    <div class='lang'>
      <button class='lang-btn' data-lang='en'>EN</button>
      <button class='lang-btn' data-lang='ro'>RO</button>
      <button class='lang-btn' data-lang='hu'>HU</button>
    </div>
    <a href='https://discord.gg/7jR3Qr9Znz' target='_blank' rel='noopener' class='btn btn-small' data-i18n='nav.discord'>Join Discord</a>
  </nav>
</header>

<main>
  <section class='hero' id='home'>
    <div class='hero-glow'></div>
    <p class='eyebrow' data-i18n='hero.eyebrow'></p>
    <h1>CIUC <span class='yellow'>NAVI</span></h1>
    <p class='hero-sub' data-i18n='hero.sub'></p>
    <div class='hero-cta'>
      <a href='#roster' class='btn' data-i18n='hero.cta1'></a>
      <a href='https://discord.gg/7jR3Qr9Znz' target='_blank' rel='noopener' class='btn btn-ghost' data-i18n='hero.cta2'></a>
    </div>
    <div class='hero-stats' id='hero-stats'></div>
  </section>

  <section class='section reveal' id='about'>
    <h2 class='section-title' data-i18n='about.title'></h2>
    <div class='about-grid'>
      <div class='about-text'>
        <h3 class='about-headline' data-i18n='about.headline'></h3>
        <p data-i18n='about.p1'></p>
        <p data-i18n='about.p2'></p>
        <p class='about-btn'><a href='https://steamcommunity.com/groups/keyboardgoblin' target='_blank' rel='noopener' class='btn btn-ghost btn-small' data-i18n='about.steam'></a></p>
      </div>
      <ul class='facts'>
        <li><span data-i18n='facts.game'></span> Counter-Strike 2</li>
        <li><span data-i18n='facts.mode'></span> Premier</li>
        <li><span data-i18n='facts.origin'></span> Miercurea Ciuc, RO</li>
      </ul>
    </div>
  </section>

  <section class='section' id='roster'>
    <h2 class='section-title reveal' data-i18n='roster.title'></h2>
    <div class='grid' id='main-grid'></div>
  </section>

  <section class='section' id='bench'>
    <h2 class='section-title reveal' data-i18n='bench.title'></h2>
    <div class='grid grid-bench' id='bench-grid'></div>
    <p class='empty' id='bench-empty' data-i18n='bench.empty' hidden></p>
  </section>

  <section class='section reveal' id='merch'>
    <h2 class='section-title' data-i18n='merch.title'></h2>
    <div class='merch-box'>
      <span class='badge' data-i18n='merch.badge'></span>
      <p data-i18n='merch.text'></p>
    </div>
  </section>

  <section class='section cta-band reveal'>
    <h2 data-i18n='cta.title'></h2>
    <p data-i18n='cta.text'></p>
    <a href='https://discord.gg/7jR3Qr9Znz' target='_blank' rel='noopener' class='btn' data-i18n='cta.btn'></a>
  </section>
</main>

<footer class='footer'>
  <p><span id='stats-updated'></span>&copy; <span id='year'></span> Ciuc Navi. <span data-i18n='footer.text'></span></p>
</footer>

<script src='js/common.js'></script>
<script src='js/main.js'></script>
</body>
</html>
